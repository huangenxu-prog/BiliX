name: BiliX Category API Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/category-api-diagnostics.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare real category pagination across endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          for rid, label in [(181, "film"), (3, "music")]:
              for endpoint in ("dynamic/region", "newlist"):
                  seen = set()
                  for pn in range(1, 5):
                      args = urllib.parse.urlencode({"rid": rid, "pn": pn, "ps": 20})
                      url = "https://api.bilibili.com/x/web-interface/" + endpoint + "?" + args
                      req = urllib.request.Request(url, headers={
                          "Referer": "https://www.bilibili.com/",
                          "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
                      })
                      try:
                          with urllib.request.urlopen(req, timeout=12) as resp:
                              body = json.load(resp)
                          rows = (body.get("data") or {}).get("archives") or []
                          ids = [r.get("bvid") for r in rows if r.get("bvid")]
                          fresh = set(ids) - seen
                          seen.update(ids)
                          print(json.dumps({"region": label, "endpoint": endpoint, "page": pn,
                                            "code": body.get("code"), "count": len(ids),
                                            "new": len(fresh), "total_unique": len(seen),
                                            "page_info": (body.get("data") or {}).get("page")}, ensure_ascii=False), flush=True)
                      except Exception as exc:
                          print(json.dumps({"region": label, "endpoint": endpoint, "page": pn,
                                            "error": str(exc)}), flush=True)
                      time.sleep(0.3)
          PY
